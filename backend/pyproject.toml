[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bill-analysis"
dynamic = ["version"]
description = ''
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
keywords = []
authors = [
  { name = "cromarmot", email = "yexiaorain@gmail.com" },
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: Implementation :: CPython",
  "Programming Language :: Python :: Implementation :: PyPy",
]
dependencies = [
  "fastapi>=0.111.0",
  "uvicorn[standard]",
  "pydantic-settings>=2.2.1",
  "python-multipart",
  "openpyxl>=3.1.5",
  "sqlmodel>=0.0.22,<0.1.0",
]

[project.scripts]
bill-analysis = "bill_analysis.main:cli"

[project.urls]
Documentation = "https://github.com/CroMarmot/BillAnalysis#readme"
Issues = "https://github.com/CroMarmot/BillAnalysis/issues"
Source = "https://github.com/CroMarmot/BillAnalysis"

[tool.hatch.version]
path = "src/bill_analysis/__about__.py"

[tool.hatch.envs.default]
dependencies = [
  "coverage[toml]>=6.5",
  "pytest",
]
[tool.hatch.envs.default.scripts]
test = "pytest {args:tests}"
test-cov = "coverage run -m pytest {args:tests}"
cov-report = [
  "- coverage combine",
  "coverage report",
]
cov = [
  "test-cov",
  "cov-report",
]
openapi = "python scripts/dump_openapi.py"

[[tool.hatch.envs.all.matrix]]
python = ["3.10", "3.11", "3.12"]

[tool.hatch.envs.lint]
detached = true
dependencies = [
  "mypy>=1.0.0",
  "ruff>=0.0.243",
]
[tool.hatch.envs.lint.scripts]
typing = "mypy --install-types --non-interactive {args:src/bill_analysis tests}"
style = [
  "ruff {args:.}",
]
fmt = [
  "ruff format {args:.}",
  "ruff check --fix {args:.}",
  "style",
]
all = [
  "style",
  "typing",
]

[tool.ruff]
target-version = "py310"
line-length = 120
select = [
  "A",
  "ARG",
  "B",
  "C",
  "DTZ",
  "E",
  "EM",
  "F",
  "FBT",
  "I",
  "ICN",
  "ISC",
  "N",
  "PLC",
  "PLE",
  "PLR",
  "PLW",
  "Q",
  "RUF",
  "S",
  "T",
  "TID",
  "UP",
  "W",
  "YTT",
]
ignore = [
  "B027",
  "FBT003",
  "S105", "S106", "S107",
  "C901", "PLR0911", "PLR0912", "PLR0913", "PLR0915",
  "TID252",
  "RUF001",
]
unfixable = [
  "F401",
]

[tool.ruff.isort]
known-first-party = ["bill_analysis"]

[tool.ruff.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.per-file-ignores]
"tests/**/*" = ["PLR2004", "S101", "TID252"]

[tool.coverage.run]
source_pkgs = ["bill_analysis", "tests"]
branch = true
parallel = true
omit = [
  "src/bill_analysis/__about__.py",
]

[tool.coverage.paths]
bill_analysis = ["src/bill_analysis", "*/bill-analysis/src/bill_analysis"]
tests = ["tests", "*/bill-analysis/tests"]

[tool.coverage.report]
exclude_lines = [
  "no cov",
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
